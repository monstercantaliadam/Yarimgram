name: Build Monstergram Windows

on:
  workflow_dispatch:
  push:
    branches:
      - codex/turkish-language-debug-build
      - codex/monstergram-feature-pack
    paths-ignore:
      - .github/workflows/build_spogram.yml

concurrency:
  group: monstergram-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Monstergram (Windows x64)
    runs-on: windows-2022
    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py

    steps:
      - name: Prepare directories
        shell: cmd
        run: |
          mkdir %userprofile%\TBuild\Libraries\win64
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout Monstergram repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\tdesktop

      - name: Apply lib_ui patches
        shell: bash
        run: |
          if [ -f "$TBUILD/tdesktop/Telegram/build/patches/lib_ui_colors.patch" ]; then
            git -C "$TBUILD/tdesktop/Telegram/lib_ui" apply "$TBUILD/tdesktop/Telegram/build/patches/lib_ui_colors.patch" || true
          fi

      - name: Generate DesktopPrivate (Keys & API)
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e
          if [[ ! "$TELEGRAM_API_ID" =~ ^[0-9]+$ || "$TELEGRAM_API_ID" == 17349 ]]; then
            echo "Set TELEGRAM_API_ID to your own Telegram API ID in repository secrets." >&2
            exit 1
          fi
          if [[ ! "$TELEGRAM_API_HASH" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "Set TELEGRAM_API_HASH to your own Telegram API hash in repository secrets." >&2
            exit 1
          fi
          DPDIR="$TBUILD/DesktopPrivate"
          mkdir -p "$DPDIR"

          openssl genrsa -traditional 1024 > "$DPDIR/private_stable.pem"
          openssl genrsa -traditional 1024 > "$DPDIR/private_beta.pem"
          openssl genrsa -traditional 1024 > "$DPDIR/private_alpha.pem"

          embed_key() {
            local var="$1" file="$2"
            printf 'const char *%s = R"PEM(\n' "$var"
            cat "$file"
            printf ')PEM";\n'
          }

          {
            echo '#pragma once'
            embed_key "PrivateKey"     "$DPDIR/private_stable.pem"
            embed_key "PrivateBetaKey" "$DPDIR/private_beta.pem"
          } > "$DPDIR/packer_private.h"

          {
            echo '#pragma once'
            embed_key "AlphaPrivateKey" "$DPDIR/private_alpha.pem"
          } > "$DPDIR/alpha_private.h"

          cp "$DPDIR/packer_private.h" "$TBUILD/tdesktop/Telegram/SourceFiles/_other/packer_private.h"
          cp "$DPDIR/alpha_private.h" "$TBUILD/tdesktop/Telegram/SourceFiles/_other/alpha_private.h"

          printf '#pragma once\nstatic const int ApiId = %s;\nstatic const char *ApiHash = "%s";\n' \
            "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > "$DPDIR/custom_api_id.h"

          echo "win64" > "$TBUILD/tdesktop/Telegram/build/target"
          rm -f "$DPDIR"/private_*.pem

      - name: Setup environment cache key
        shell: bash
        run: |
          DOCPATH="$TBUILD/tdesktop/docs/building-win.md"
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "$(sha256sum $TBUILD/tdesktop/Telegram/build/prepare/prepare.py | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          PATCH_KEY="$({ sha256sum "$TBUILD/tdesktop/Telegram/build/qt_version.py"; find "$TBUILD/tdesktop/Telegram/build/patches" -type f -print0 | sort -z | xargs -0 sha256sum; } | sha256sum | awk '{ print $1 }')"
          echo "PATCH_KEY=$PATCH_KEY" >> $GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        name: Setup MSVC Native Tools
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: Configure NuGet
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" || exit 0
          nuget sources Add -Source https://api.nuget.org/v3/index.json || exit 0

      - name: ThirdParty Cache
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-v3-${{ env.CACHE_KEY }}-${{ env.PATCH_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-third-party-v3-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-x64-third-party-v3-
            ${{ runner.OS }}-x64-third-party-v2-${{ env.CACHE_KEY }}-

      - name: Libraries Cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}-${{ env.PATCH_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-x64-libs-v3-
            ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}-

      - name: Qt Cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-v3-${{ env.CACHE_KEY }}-${{ env.PATCH_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-qt-v3-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-x64-qt-v3-
            ${{ runner.OS }}-x64-qt-v2-${{ env.CACHE_KEY }}-

      - name: Prepare Libraries
        id: prepare
        if: ${{ steps.cache-third-party.outputs.cache-hit != 'true' || steps.cache-libs.outputs.cache-hit != 'true' || steps.cache-qt.outputs.cache-hit != 'true' }}
        shell: cmd
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          call %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent

      - name: Free disk space
        if: ${{ steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Identify MSVC for build cache
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe).Source
          $version = (Get-Item -LiteralPath $compiler).VersionInfo.ProductVersion -replace '[^0-9.]', '_'
          "MSVC_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore compiled build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\tdesktop\out
          key: ${{ runner.os }}-x64-debug-build-v1-${{ env.CACHE_KEY }}-${{ env.MSVC_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-x64-debug-build-v1-${{ env.CACHE_KEY }}-${{ env.MSVC_VERSION }}-

      - name: Preserve unchanged source timestamps
        shell: cmd
        run: |
          python "%TBUILD%\tdesktop\.github\scripts\restore_build_mtime.py" restore "%TBUILD%\tdesktop"

      - name: Save ThirdParty Cache
        uses: actions/cache/save@v4
        if: ${{ success() && steps.cache-third-party.outputs.cache-hit != 'true' }}
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-v3-${{ env.CACHE_KEY }}-${{ env.PATCH_KEY }}

      - name: Save Libraries Cache
        uses: actions/cache/save@v4
        if: ${{ success() && steps.cache-libs.outputs.cache-hit != 'true' }}
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}-${{ env.PATCH_KEY }}

      - name: Save Qt Cache
        uses: actions/cache/save@v4
        if: ${{ success() && steps.cache-qt.outputs.cache-hit != 'true' }}
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-v3-${{ env.CACHE_KEY }}-${{ env.PATCH_KEY }}

      - name: Configure CMake
        shell: cmd
        run: |
          cd %TBUILD%\tdesktop\Telegram
          call configure.bat ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Build Monstergram Debug
        id: build
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          _PreferredToolArchitecture: x64
        run: |
          Set-Location (Join-Path $env:TBUILD 'tdesktop')
          $PSNativeCommandUseErrorActionPreference = $false
          $buildLog = Join-Path $env:RUNNER_TEMP 'monstergram-build.log'
          & cmake --build out --config Debug --target Telegram --parallel 2 -- /p:CL_MPCount=2 2>&1 | Tee-Object -FilePath $buildLog
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $errors = @(Get-Content $buildLog | Select-String -Pattern 'warning C[0-9]+|error C[0-9]+|error LNK[0-9]+|error MSB[0-9]+|fatal error|error:')
            $details = if ($errors.Count) { $errors | Select-Object -Last 30 } else { Get-Content $buildLog -Tail 12 }
            foreach ($detail in $details) {
              $line = $detail.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$line"
            }
            exit $buildExit
          }

      - name: Record compiled source versions
        if: ${{ success() || steps.build.outcome == 'failure' }}
        shell: cmd
        run: |
          python "%TBUILD%\tdesktop\.github\scripts\restore_build_mtime.py" save "%TBUILD%\tdesktop"

      - name: Save compiled build cache
        uses: actions/cache/save@v4
        if: ${{ success() || steps.build.outcome == 'failure' }}
        continue-on-error: true
        with:
          path: ${{ env.TBUILD }}\tdesktop\out
          key: ${{ runner.os }}-x64-debug-build-v1-${{ env.CACHE_KEY }}-${{ env.MSVC_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package Monstergram Executable
        shell: cmd
        run: |
          set OUT=%TBUILD%\tdesktop\out\Debug
          mkdir %GITHUB_WORKSPACE%\artifact
          if not exist "%OUT%\Monstergram.exe" (echo Monstergram.exe was not built & exit /b 1)
          copy /Y "%OUT%\Monstergram.exe" "%GITHUB_WORKSPACE%\artifact\Monstergram.exe"
          if errorlevel 1 exit /b 1
          if exist "%OUT%\Updater.exe" copy /Y "%OUT%\Updater.exe" "%GITHUB_WORKSPACE%\artifact\Updater.exe"

      - name: Upload Monstergram.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monstergram-Windows-x64-Debug
          path: ${{ github.workspace }}\artifact\
